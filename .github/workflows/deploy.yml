name: Deploy to Cloudflare

# Push to main deploys prod. Never trigger on pull_request: this repo is
# public, and fork PRs must not get near the Cloudflare token.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Let an in-flight deploy finish rather than racing a newer one onto the Worker.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run deploy` is `vite build && wrangler deploy`. The VITE_ vars are
      # read at build time and baked into the bundle, so they must be set here.
      - run: npm run deploy
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
